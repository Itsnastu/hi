<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I Love You</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    /* SECTION SHARED */
    section {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* FIRST SCREEN */
    #home {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      z-index: 2;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: white;
      padding: 40px 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 16px 32px rgba(0,0,0,0.18);
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 3rem);
      color: #ff4d6d;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      border: none;
      border-radius: 999px;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    /* SECOND SCREEN */
    #love {
      background: radial-gradient(circle at top, #ffd1dc, #ffb6c1);
      opacity: 0;
      pointer-events: none;
    }

    #love.active {
      opacity: 1;
      pointer-events: auto;
    }

    #home.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
    }

    .message {
      position: relative;
      width: 100%;
      max-width: 380px;
      background: rgba(255,255,255,0.92);
      padding: 30px 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 18px 36px rgba(0,0,0,0.25);
      z-index: 2;
    }

    .message p {
      font-size: 1rem;
      line-height: 1.6;
      color: #444;
    }

    /* FLOATING HEARTS & FLOWERS */
    .float {
      position: absolute;
      bottom: -40px;
      pointer-events: none;
      animation: floatUp linear infinite;
      opacity: 0.85;
    }

    @keyframes floatUp {
      from { transform: translateY(0); }
      to { transform: translateY(-120vh); }
    }
  </style>
</head>
<body>

  <!-- FIRST VIEW -->
  <section id="home">
    <div class="card">
      <h1>I love you</h1>
      <button onclick="showLove()">Tap to continue 💖</button>
    </div>
  </section>

  <!-- SECOND VIEW -->
  <section id="love">
    <div class="message">
      <p>
        Since the first day I met you I knew you were someone I would love to have around.
        I took a break and came back just to run into your shadows.
        How beautiful the moon was when I heard your voice again,
        when I saw your face,
        when I understood how special you are to me.
      </p>
    </div>
  </section>

  <script>
    const symbols = ["❤️", "💖", "🌸", "🌺", "💕"];

    function showLove() {
      document.getElementById("home").classList.add("hidden");
      document.getElementById("love").classList.add("active");
      startFloating();
    }

    function startFloating() {
      setInterval(() => {
        const el = document.createElement("div");
        el.className = "float";
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.fontSize = 18 + Math.random() * 22 + "px";
        el.style.animationDuration = 8 + Math.random() * 6 + "s";

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 15000);
      }, 600);
    }
  </script>

</body>
</html>
